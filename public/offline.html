<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>보글마켓</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #f6ede0;
        color: #4a3826;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
      }
      h1 {
        margin: 0;
        font-size: 17px;
      }
      p {
        margin: 0;
        font-size: 13.5px;
        color: #8d7a66;
        line-height: 1.6;
      }
      button {
        margin-top: 8px;
        padding: 11px 22px;
        border: none;
        border-radius: 10px;
        background: #c9532f;
        color: #fff;
        font-size: 13.5px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="보글마켓" />
    <h1>인터넷 연결이 끊겼어요</h1>
    <p>Wi-Fi나 데이터 연결을 확인한 뒤<br />다시 시도해주세요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </body>
</html>
